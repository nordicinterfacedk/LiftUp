<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LiftUp</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftUp">
<meta name="theme-color" content="#121316">
<style>
  :root{
    --danger:#E2604A;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  html[data-mode="dark"]{
    --bg:#121316; --surface:#1A1B20; --surface2:#212228;
    --border:rgba(255,255,255,.07); --border-soft:rgba(255,255,255,.045);
    --ink:#F2F1ED; --muted:#93939C; --faint:#55555F;
  }
  html[data-mode="light"]{
    --bg:#FAF8F3; --surface:#F1EDE3; --surface2:#E9E4D6;
    --border:rgba(20,16,8,.09); --border-soft:rgba(20,16,8,.055);
    --ink:#211C13; --muted:#78715F; --faint:#AEA48D;
  }
  html[data-theme="amber"]{ --accent:#E7A550; --accent-ink:#241905; --accent-dim:rgba(231,165,80,.14); --accent-shadow:rgba(231,165,80,.35); }
  html[data-theme="ocean"]{ --accent:#5FB6D8; --accent-ink:#052029; --accent-dim:rgba(95,182,216,.14); --accent-shadow:rgba(95,182,216,.35); }
  html[data-theme="sage"]{ --accent:#86C296; --accent-ink:#0C2013; --accent-dim:rgba(134,194,150,.14); --accent-shadow:rgba(134,194,150,.35); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; transition:background .2s,color .2s;}
  body{min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;
    padding-top:max(22px, env(safe-area-inset-top));
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
    padding-bottom:calc(112px + env(safe-area-inset-bottom));
  }
  h1,h2,h3,h4{margin:0;}
  svg.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}

  .brand{text-align:center;padding:2px 0 18px;}
  .brand span{font-size:15px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    background:linear-gradient(135deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}

  header.top{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0 22px;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  h1.pagetitle{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px;}

  .datebar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:26px;}
  .datebar button{border:none;background:none;color:var(--faint);padding:4px;}
  .datebar button:disabled{opacity:.2;}
  .datelabel{display:flex;flex-direction:column;align-items:center;min-width:140px;}
  .datelabel b{font-size:16px;font-weight:600;}
  .badge-today{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-top:2px;}

  /* --- hero --- */
  .hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 28px;}
  .hero.small{padding:2px 0 22px;}
  .ring-wrap{position:relative;width:176px;height:176px;}
  .ring-wrap.small{width:140px;height:140px;}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-num b{font-size:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .ring-wrap.small .ring-num b{font-size:28px;}
  .ring-num span{font-size:12px;color:var(--muted);margin-top:2px;}
  .hero-stats{display:flex;align-items:center;gap:0;margin-top:24px;width:100%;max-width:300px;}
  .hstat{flex:1;text-align:center;}
  .hstat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hstat span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .hstat.div{flex:0 0 1px;height:28px;background:var(--border);}

  /* --- macro bars --- */
  .macro-block{margin-bottom:26px;}
  .macro-block h4{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}
  .mrow{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .mrow:last-child{margin-bottom:0;}
  .mrow .mlabel{font-size:12.5px;color:var(--muted);width:52px;flex-shrink:0;}
  .mrow .mtrack{flex:1;height:7px;border-radius:4px;background:var(--surface);overflow:hidden;}
  .mrow .mfill{height:100%;border-radius:4px;background:var(--accent);}
  .mrow .mval{font-size:12px;color:var(--muted);width:66px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0;}

  /* --- list sections --- */
  .section{margin-bottom:28px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .section-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .section-head h3 svg{color:var(--accent);width:16px;height:16px;}
  .addlink{border:none;background:none;color:var(--accent);font-size:13px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;gap:4px;padding:6px 2px;}

  ul.rows{list-style:none;margin:6px 0 0;padding:0;}
  ul.rows li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
    border-bottom:1px solid var(--border-soft);}
  ul.rows li:last-child{border-bottom:none;}
  .rl b{font-weight:500;font-size:14.5px;}
  .rl small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;}
  .rr{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .rr span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .rr button{border:none;background:none;color:var(--faint);opacity:.55;padding:2px;display:flex;}
  .empty{color:var(--faint);font-size:14px;padding:14px 0 4px;}

  .weight-row{display:flex;align-items:center;justify-content:space-between;padding-top:2px;}
  .weight-val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
  .weight-val span{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px;}

  /* --- FAB --- */
  .fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));
    width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--accent-shadow);z-index:40;}
  .fab svg{width:24px;height:24px;stroke-width:2.3;}

  .theme-swatches{display:flex;gap:10px;}
  .swatch{width:34px;height:34px;border-radius:50%;border:none;position:relative;flex-shrink:0;}
  .swatch.amber{background:#E7A550;} .swatch.ocean{background:#5FB6D8;} .swatch.sage{background:#86C296;}
  .swatch.active{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);}
  .swatch svg{position:absolute;inset:0;margin:auto;width:15px;height:15px;stroke-width:3;color:#14110A;}

  /* --- sheet --- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface2);border-radius:24px 24px 0 0;
    border:1px solid var(--border);border-bottom:none;z-index:51;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
    padding:14px 20px calc(24px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;max-height:82vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
  .sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-top h3{font-size:16px;font-weight:700;}
  .sheet-close{border:none;background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px;margin-bottom:18px;}
  .seg button{flex:1;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:9px 0;border-radius:8px;font-family:inherit;}
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  .sheet-form{display:flex;flex-direction:column;gap:12px;}
  .sheet-form input{font-family:inherit;font-size:15px;padding:13px 14px;border-radius:var(--r-sm);
    border:1px solid var(--border);background:var(--surface);color:var(--ink);width:100%;}
  .sheet-form input::placeholder{color:var(--faint);}
  .sheet-form input:focus{outline:none;border-color:var(--accent);}
  .frow{display:flex;gap:10px;}
  .frow input{flex:1;min-width:0;}
  .sheet-submit{margin-top:6px;border:none;background:var(--accent);color:var(--accent-ink);padding:14px;
    border-radius:var(--r-sm);font-weight:700;font-size:15px;width:100%;font-family:inherit;}

  .exercise-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .exercise-chip{padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;}
  .exercise-chip:active{background:var(--accent-dim);border-color:var(--accent);}
  .back-link{border:none;background:none;color:var(--accent);font-size:13.5px;font-weight:700;font-family:inherit;
    display:flex;align-items:center;gap:4px;margin-bottom:16px;padding:0;}
  .back-link svg{width:16px;height:16px;}

  /* --- stats/panels --- */
  .seg-tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:11px;margin-bottom:24px;}
  .seg-tabs button{flex:1;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:9px 0;border-radius:8px;font-family:inherit;}
  .seg-tabs button.active{background:var(--accent);color:var(--accent-ink);}

  .stat-line{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);padding:16px 0;margin-bottom:22px;}
  .stat-line .s{flex:1;text-align:center;padding:0 2px;}
  .stat-line .s b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-line .s span{display:block;font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.02em;}
  .stat-line .d{width:1px;align-self:stretch;background:var(--border);margin:2px 0;}

  .panel{margin-bottom:24px;}
  .panel h4{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}
  .bars{display:flex;align-items:flex-end;gap:5px;height:120px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;border-radius:3px 3px 0 0;background:var(--accent);min-height:3px;opacity:.85;}
  .bar.over{background:var(--danger);}
  .bar-date{font-size:8.5px;color:var(--faint);margin-top:7px;}

  .macro-stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface);margin-bottom:12px;}
  .macro-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
  .macro-legend b{color:var(--ink);font-weight:600;}

  .weight-chart{width:100%;height:100px;}

  /* --- settings --- */
  .glabel{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
    margin:0 0 8px 4px;}
  .group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:24px;overflow:hidden;}
  .grow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
  .grow:last-child{border-bottom:none;}
  .grow .glbl{font-size:14.5px;}
  .grow input{border:none;background:none;color:var(--ink);font-family:inherit;font-size:14.5px;text-align:right;
    width:80px;padding:0;font-variant-numeric:tabular-nums;}
  .grow input:focus{outline:none;}
  .grow .unit-toggle{display:flex;background:var(--bg);border-radius:9px;padding:3px;}
  .grow .unit-toggle button{border:none;background:none;color:var(--muted);font-weight:700;font-size:12.5px;
    padding:6px 14px;border-radius:6px;font-family:inherit;}
  .grow .unit-toggle button.active{background:var(--accent);color:var(--accent-ink);}
  .grow.danger{color:var(--danger);}
  .grow.danger button{border:none;background:none;color:var(--danger);font-family:inherit;font-size:14.5px;
    font-weight:600;width:100%;text-align:left;padding:0;}
  .settings-foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:6px;line-height:1.6;}

  /* --- tab bar --- */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-inner{display:flex;gap:1px;background:rgba(20,21,26,.82);backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--border);border-radius:20px;padding:7px;margin:0 12px 14px;max-width:470px;width:calc(100% - 24px);}
  html[data-mode="light"] .tabbar-inner{background:rgba(250,248,243,.82);}
  .tabbtn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 0 5px;border-radius:14px;color:var(--faint);font-family:inherit;font-size:9.5px;font-weight:600;letter-spacing:-.01em;}
  .tabbtn svg.icon{width:17px;height:17px;}
  .tabbtn.active{color:var(--ink);}
  .tabbtn.active svg{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<button class="fab" id="fabBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-top"><h3>Add entry</h3>
    <button class="sheet-close" id="sheetClose">✕</button></div>
  <div class="seg" id="sheetSeg">
    <button data-kind="food" class="active">Food</button>
    <button data-kind="workout">Workout</button>
    <button data-kind="weight">Weight</button>
  </div>
  <div id="sheetBody"></div>
</div>

<nav class="tabbar"><div class="tabbar-inner" id="tabbar"></div></nav>

<script>
const STORE_KEY = "liftup-data-v1";
const DEFAULT = {
  settings:{calorieGoal:2200, proteinGoal:150, carbGoal:220, fatGoal:70, weightUnit:"kg", theme:"amber", mode:"dark"},
  food:[], workouts:[], weights:[]
};

const EXERCISES = [
  {id:'pullups', name:'Pull-ups', kind:'reps'},
  {id:'pushups', name:'Push-ups', kind:'reps'},
  {id:'situps', name:'Sit-ups', kind:'reps'},
  {id:'squats_bw', name:'Squats', kind:'reps'},
  {id:'lunges', name:'Lunges', kind:'reps'},
  {id:'burpees', name:'Burpees', kind:'reps'},
  {id:'bench', name:'Bench press', kind:'strength'},
  {id:'deadlift', name:'Deadlift', kind:'strength'},
  {id:'squat_bb', name:'Barbell squat', kind:'strength'},
  {id:'ohp', name:'Overhead press', kind:'strength'},
  {id:'row_bb', name:'Barbell row', kind:'strength'},
  {id:'running', name:'Running', kind:'cardio'},
  {id:'cycling', name:'Cycling', kind:'cardio'},
  {id:'rowing', name:'Rowing', kind:'cardio'},
  {id:'swimming', name:'Swimming', kind:'cardio'},
  {id:'walking', name:'Walking', kind:'cardio'},
  {id:'other', name:'Other', kind:'custom'},
];

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return {
        settings: Object.assign(structuredClone(DEFAULT.settings), parsed.settings||{}),
        food: parsed.food||[], workouts: parsed.workouts||[], weights: parsed.weights||[]
      };
    }
    const older = localStorage.getItem("ledger-data-v2") || localStorage.getItem("ledger-data-v1");
    if(older){
      const o = JSON.parse(older);
      return {
        settings: Object.assign(structuredClone(DEFAULT.settings), o.settings||{}),
        food:o.food||[], workouts:o.workouts||[], weights:o.weights||[]
      };
    }
    return structuredClone(DEFAULT);
  }catch(e){ return structuredClone(DEFAULT); }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function applyTheme(){
  document.documentElement.setAttribute("data-theme", data.settings.theme);
  document.documentElement.setAttribute("data-mode", data.settings.mode);
}

let data = load();
let view = "today";
let statsRange = 7;
let sheetKind = "food";
let sheetExercise = null;
let date = todayISO();

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso,n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function fmtShort(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function kgToDisplay(kg){ return data.settings.weightUnit==="lb" ? Math.round(kg*2.20462*10)/10 : kg; }
function displayToKg(v){ return data.settings.weightUnit==="lb" ? Math.round((v/2.20462)*10)/10 : v; }

const ICONS = {
  today:'<path d="M4 10.5V19a1 1 0 0 0 1 1h4v-5h6v5h4a1 1 0 0 0 1-1v-8.5"/><path d="M2 11l10-8 10 8"/>',
  stats:'<path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 18l6-6-6-6"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  dumbbell:'<path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l-2-2"/><path d="M2 6l2-2"/><path d="M7.5 3.5l-4 4"/><path d="M20.5 16.5l-4 4"/><path d="M6 6l-2.5-1.5-1 1L4 8"/>',
  scale:'<path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
};
function icon(name){ return `<svg class="icon" viewBox="0 0 24 24">${ICONS[name]}</svg>`; }
applyTheme();

function render(){
  const el = document.getElementById("view");
  if(view==="today") el.innerHTML = renderToday();
  else if(view==="calories") el.innerHTML = renderCalories();
  else if(view==="workouts") el.innerHTML = renderWorkouts();
  else if(view==="stats") el.innerHTML = renderStats();
  else el.innerHTML = renderSettings();
  renderTabbar();
  attachHandlers();
}

function renderTabbar(){
  const tabs = [["today","Today","today"],["calories","Calories","flame"],["workouts","Workouts","dumbbell"],["stats","Stats","stats"],["settings","Settings","settings"]];
  document.getElementById("tabbar").innerHTML = tabs.map(([id,label,ic])=>
    `<button class="tabbtn ${view===id?'active':''}" data-tab="${id}">${icon(ic)}<span>${label}</span></button>`
  ).join('');
  document.querySelectorAll(".tabbtn").forEach(b=>{ b.onclick = ()=>{ view=b.dataset.tab; render(); }; });
}

function dayTotals(d){
  const f = data.food.filter(e=>e.date===d);
  const w = data.workouts.filter(x=>x.date===d);
  return {
    eaten: f.reduce((s,e)=>s+Number(e.calories||0),0),
    protein: f.reduce((s,e)=>s+Number(e.protein||0),0),
    carbs: f.reduce((s,e)=>s+Number(e.carbs||0),0),
    fat: f.reduce((s,e)=>s+Number(e.fat||0),0),
    burned: w.reduce((s,x)=>s+Number(x.calories||0),0),
    workouts: w.length,
  };
}
function lastNDates(n){ const arr=[]; for(let i=n-1;i>=0;i--) arr.push(addDays(todayISO(),-i)); return arr; }
function weekWorkoutStats(){
  const days = lastNDates(7);
  const items = data.workouts.filter(w=>days.includes(w.date));
  const volume = items.reduce((s,w)=> s + (((w.kind==='reps'||w.kind==='strength')) ? (Number(w.sets||0)*Number(w.reps||0)) : 0), 0);
  const cardioMin = items.reduce((s,w)=> s + (w.kind==='cardio' ? Number(w.duration||0) : 0), 0);
  const calBurned = items.reduce((s,w)=>s+Number(w.calories||0),0);
  return { count: items.length, volume, cardioMin, calBurned };
}
function workoutRight(w){
  const kind = w.kind || 'custom';
  let main = '';
  if(kind==='reps') main = `${w.sets||0}×${w.reps||0}`;
  else if(kind==='strength') main = `${w.sets||0}×${w.reps||0}${w.weight?` @ ${w.weight}kg`:''}`;
  else if(kind==='cardio') main = [w.duration?`${w.duration} min`:null, w.distance?`${w.distance} km`:null].filter(Boolean).join(' · ');
  else main = [w.duration?`${w.duration} min`:null].filter(Boolean).join(' · ');
  const cal = w.calories?`${main?' · ':''}${w.calories} kcal`:'';
  return (main||'') + cal;
}

  const isToday = date===todayISO();
  return `<div class="datebar">
    <button id="prevDay">${icon('chevL')}</button>
    <div class="datelabel"><b>${fmtDate(date)}</b>${isToday?'<span class="badge-today">today</span>':''}</div>
    <button id="nextDay" ${isToday?'disabled':''}>${icon('chevR')}</button>
  </div>`;
}

function renderCalories(){

  const s = data.settings;
  const net = t.eaten - t.burned;

  const pct = Math.max(0, Math.min(1, net / s.calorieGoal));

  <div class="hero small">
    <div class="ring-wrap small">

      </svg>
      <div class="ring-num"><b>${Math.abs(left)}</b><span>${over?'kcal over':'kcal left'}</span></div>
    </div>
    <div class="hero-stats">
      <div class="hstat"><b>${t.eaten}</b><span>Eaten</span></div>
      <div class="hstat div"></div>
      <div class="hstat"><b>${s.calorieGoal}</b><span>Goal</span></div>
      <div class="hstat div"></div>
      <div class="hstat"><b>${t.burned}</b><span>Burned</span></div>
    </div>

  <div class="macro-block">
    <h4>Macros</h4>
    ${mrow('Protein', t.protein, s.proteinGoal, 1)}
    ${mrow('Carbs', t.carbs, s.carbGoal, .65)}

  <div class="panel">

      <button class="addlink" data-open-sheet="food">+ Add</button></div>
    ${dayFood.length===0 ? '<p class="empty">Nothing logged yet.</p>' : `<ul class="rows">
      ${dayFood.map(e=>`<li>
        <div class="rl"><b>${esc(e.name)}</b>${(e.protein||e.carbs||e.fat)?`<small>${[e.protein?`P${e.protein}`:null,e.carbs?`C${e.carbs}`:null,e.fat?`F${e.fat}`:null].filter(Boolean).join(' · ')}</small>`:''}</div>
        <div class="rr"><span>${e.calories} kcal</span><button data-remove-food="${e.id}">${icon('trash')}</button></div>
      </li>`).join('')}

function renderWorkouts(){

    return {date:d, count:items.length, cal:items.reduce((s,w)=>s+Number(w.calories||0),0)};

  const maxVal = Math.max(...days.map(d=>d.cal), 1);

  return `

function computeStreak(){
  let streak=0, d=todayISO();
  while(true){
    const has = data.food.some(e=>e.date===d) || data.workouts.some(w=>w.date===d);
    if(!has) break;
    streak++; d=addDays(d,-1);
  }
  return streak;
}

function renderStats(){
  const days=[];
  for(let i=statsRange-1;i>=0;i--){
    const d=addDays(todayISO(),-i);
    const t = dayTotals(d);
    days.push({date:d, net:t.eaten-t.burned, ...t});
  }
  const s = data.settings;
  const maxVal = Math.max(s.calorieGoal, ...days.map(d=>d.net), 1);
  const avgNet = Math.round(days.reduce((a,d)=>a+d.net,0)/days.length) || 0;
  const totalWorkouts = days.reduce((a,d)=>a+d.workouts,0);
  const streak = computeStreak();
  const wk = weekWorkoutStats();

  const totProtein = days.reduce((a,d)=>a+d.protein,0);
  const totCarbs = days.reduce((a,d)=>a+d.carbs,0);
  const totFat = days.reduce((a,d)=>a+d.fat,0);
  const macroSum = totProtein+totCarbs+totFat || 1;
  const pPct = Math.round(totProtein/macroSum*100), cPct = Math.round(totCarbs/macroSum*100), fPct=100-pPct-cPct;

  const weightPoints = data.weights.slice(-statsRange);
  let chartSvg = '';
  if(weightPoints.length>=2){
    const vals = weightPoints.map(w=>kgToDisplay(w.weight));
    const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const W=300,H=90,pad=6;
    const pts = vals.map((v,i)=>{
      const x = pad + (i/(vals.length-1))*(W-pad*2);
      const y = H-pad - ((v-min)/range)*(H-pad*2);
      return [x,y];
    });
    const line = pts.map(p=>p.join(',')).join(' ');
    chartSvg = `<svg class="weight-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="var(--accent)"/>`).join('')}
    </svg>`;
  }

  return `
  <div class="brand"><span>LiftUp</span></div>
  <header class="top"><div><div class="eyebrow">Overview</div><h1 class="pagetitle">Stats</h1></div></header>

  <div class="seg-tabs">
    <button data-range="7" class="${statsRange===7?'active':''}">7 days</button>
    <button data-range="30" class="${statsRange===30?'active':''}">30 days</button>
  </div>

  <div class="stat-line">
    <div class="s"><b>${streak}</b><span>Streak</span></div>
    <div class="d"></div>
    <div class="s"><b>${avgNet}</b><span>Avg kcal</span></div>
    <div class="d"></div>
    <div class="s"><b>${totalWorkouts}</b><span>Workouts</span></div>
    <div class="d"></div>
    <div class="s"><b>${wk.volume}</b><span>Volume/wk</span></div>
  </div>

  <div class="panel">
    <h4>Net calories</h4>
    <div class="bars">
      ${days.map(d=>`<div class="bar-col">
        <div class="bar ${d.net>s.calorieGoal?'over':''}" style="height:${Math.max(2,(d.net/maxVal)*110)}px;"></div>
        ${statsRange<=7?`<div class="bar-date">${fmtShort(d.date).split(' ')[0]}</div>`:''}
      </div>`).join('')}
    </div>
  </div>

  <div class="panel">
    <h4>Macro balance</h4>
    <div class="macro-stack">
      <div style="width:${pPct}%;background:var(--accent);"></div>
      <div style="width:${cPct}%;background:var(--muted);"></div>
      <div style="width:${fPct}%;background:var(--faint);"></div>
    </div>
    <div class="macro-legend">
      <span>Protein <b>${pPct}%</b></span><span>Carbs <b>${cPct}%</b></span><span>Fat <b>${fPct}%</b></span>
    </div>
  </div>

  ${weightPoints.length>=2 ? `<div class="panel"><h4>Weight trend</h4>${chartSvg}</div>` : ''}
  `;
}

      <div class="frow">
        <input name="protein" type="number" inputmode="numeric" placeholder="Protein g">
        <input name="carbs" type="number" inputmode="numeric" placeholder="Carbs g">
        <input name="fat" type="number" inputmode="numeric" placeholder="Fat g">

      <button type="submit" class="sheet-submit">Add food</button>

  return `
    <div class="sheet-form">

      <input name="sets" type="number" inputmode="numeric" placeholder="Sets" required>
      <input name="reps" type="number" inputmode="numeric" placeholder="Reps" required>

      <input name="reps" type="number" inputmode="numeric" placeholder="Reps" required>
      <input name="weight" type="number" inputmode="numeric" placeholder="kg">

function workoutSheetHTML(){
  if(!sheetExercise){
    return `<div class="exercise-grid">${EXERCISES.map(ex=>`<button type="button" class="exercise-chip" data-exercise="${ex.id}">${ex.name}</button>`).join('')}</div>`;
  }
  const ex = EXERCISES.find(e=>e.id===sheetExercise);
  return `
    <button type="button" class="back-link" id="backToExercises">${icon('chevL')} ${ex.name}</button>
    <form id="sheetForm" class="sheet-form">
      ${exerciseFieldsHTML(ex)}
      <button type="submit" class="sheet-submit">Add ${ex.name}</button>
    </form>`;
}

function renderSheetBody(){
  const body = document.getElementById("sheetBody");
  if(sheetKind==="workout"){
    body.innerHTML = workoutSheetHTML();
    if(sheetExercise){
      document.getElementById("sheetForm").onsubmit = handleSheetSubmit;
      document.getElementById("backToExercises").onclick = ()=>{ sheetExercise=null; renderSheetBody(); };
    } else {
      document.querySelectorAll("[data-exercise]").forEach(btn=>{
        btn.onclick = ()=>{ sheetExercise = btn.dataset.exercise; renderSheetBody(); };
      });
    }
  } else {
    body.innerHTML = `<form id="sheetForm">${sheetFormHTML(sheetKind)}</form>`;
    document.getElementById("sheetForm").onsubmit = handleSheetSubmit;
  }
}

function openSheet(kind){
  sheetKind = kind;
  if(kind==="workout") sheetExercise = null;
  document.querySelectorAll("#sheetSeg button").forEach(b=>b.classList.toggle("active", b.dataset.kind===kind));
  renderSheetBody();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheetBackdrop").classList.add("open");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetBackdrop").classList.remove("open");
}
function handleSheetSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  if(sheetKind==="food"){
    data.food.push({id:uid(), date, name:f.get("name"), calories:Number(f.get("calories")||0),
      protein:Number(f.get("protein")||0), carbs:Number(f.get("carbs")||0), fat:Number(f.get("fat")||0)});
  } else if(sheetKind==="workout"){
    const ex = EXERCISES.find(x=>x.id===sheetExercise) || EXERCISES.find(x=>x.id==='other');
    if(ex.kind==='custom'){
      data.workouts.push({id:uid(), date, exerciseId:'other', name:f.get("name"), kind:'custom',
        duration:Number(f.get("duration")||0), calories:Number(f.get("calories")||0), notes:f.get("notes")||""});
    } else if(ex.kind==='reps'){
      data.workouts.push({id:uid(), date, exerciseId:ex.id, name:ex.name, kind:'reps',
        sets:Number(f.get("sets")||0), reps:Number(f.get("reps")||0), calories:Number(f.get("calories")||0)});
    } else if(ex.kind==='strength'){
      data.workouts.push({id:uid(), date, exerciseId:ex.id, name:ex.name, kind:'strength',
        sets:Number(f.get("sets")||0), reps:Number(f.get("reps")||0), weight:Number(f.get("weight")||0), calories:Number(f.get("calories")||0)});
    } else if(ex.kind==='cardio'){
      data.workouts.push({id:uid(), date, exerciseId:ex.id, name:ex.name, kind:'cardio',
        duration:Number(f.get("duration")||0), distance:Number(f.get("distance")||0), calories:Number(f.get("calories")||0)});
    }
    sheetExercise = null;
  } else {
    const kg = displayToKg(Number(f.get("weight")));
    data.weights = data.weights.filter(w=>w.date!==date);
    data.weights.push({date, weight:kg});
    data.weights.sort((a,b)=>a.date.localeCompare(b.date));
  }
  save(); closeSheet(); render();
}

function attachHandlers(){
  document.getElementById("fabBtn").onclick = ()=> openSheet(view==="workouts" ? "workout" : view==="calories" ? "food" : sheetKind);
  document.getElementById("sheetClose").onclick = closeSheet;
  document.getElementById("sheetBackdrop").onclick = closeSheet;
  document.querySelectorAll("#sheetSeg button").forEach(b=>{
    b.onclick = ()=> openSheet(b.dataset.kind);
  });

  const prevBtn = document.getElementById("prevDay");
  if(prevBtn) prevBtn.onclick = ()=>{ date=addDays(date,-1); render(); };
  const nextBtn = document.getElementById("nextDay");
  if(nextBtn) nextBtn.onclick = ()=>{ date=addDays(date,1); render(); };

  document.querySelectorAll("[data-open-sheet]").forEach(b=>{
    b.onclick = ()=> openSheet(b.dataset.openSheet);
  });
  document.querySelectorAll("[data-remove-food]").forEach(btn=>{
    btn.onclick = ()=>{ data.food = data.food.filter(e=>e.id!==btn.dataset.removeFood); save(); render(); };
  });
  document.querySelectorAll("[data-remove-workout]").forEach(btn=>{
    btn.onclick = ()=>{ data.workouts = data.workouts.filter(w=>w.id!==btn.dataset.removeWorkout); save(); render(); };
  });

  if(view==="stats"){
    document.querySelectorAll("[data-range]").forEach(btn=>{
      btn.onclick = ()=>{ statsRange = Number(btn.dataset.range); render(); };
    });
  }

  if(view==="settings"){
    document.querySelectorAll("[data-theme-choice]").forEach(btn=>{
      btn.onclick = ()=>{ data.settings.theme = btn.dataset.themeChoice; save(); applyTheme(); render(); };
    });
    document.querySelectorAll("#modeToggle button").forEach(btn=>{
      btn.onclick = ()=>{ data.settings.mode = btn.dataset.mode; save(); applyTheme(); render(); };
    });
    const bind = (id,key)=>{
      const el = document.getElementById(id);
      el.onchange = ()=>{ data.settings[key] = Number(el.value)||0; save(); };
    };
    bind("gCal","calorieGoal"); bind("gPro","proteinGoal"); bind("gCarb","carbGoal"); bind("gFat","fatGoal");
    document.querySelectorAll("[data-unit]").forEach(btn=>{
      btn.onclick = ()=>{ data.settings.weightUnit = btn.dataset.unit; save(); render(); };
    });
    document.getElementById("resetBtn").onclick = ()=>{
      if(confirm("Erase all logged food, workouts and weight entries? This can't be undone.")){
        data = structuredClone(DEFAULT); save(); render();
      }
    };
  }
}

render();
</script>
</body>
</html>
